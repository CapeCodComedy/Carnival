<style>
:root{--ink:#171a2b;--line:#31364f;--bone:#d8d3c5;--dim:#8d8fa3;--glow:#f5b445}

.org{font-family:'Spline Sans Mono',monospace;font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:var(--dim);margin-bottom:22px}
h1{font-family:'Big Shoulders',sans-serif;font-weight:800;font-size:clamp(34px,7vw,66px);line-height:1;color:#fff;text-transform:uppercase}
h1 span{color:var(--glow)}
p{margin-top:18px;color:var(--dim)}
.links{margin-top:30px;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
<body>
